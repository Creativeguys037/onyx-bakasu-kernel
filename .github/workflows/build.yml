name: build-bakasu-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libssl-dev libelf-dev bison flex cpio rsync zip unzip
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Sync kernel manifest
        run: |
          mkdir -p "$RUNNER_TEMP/kernel"
          cd "$RUNNER_TEMP/kernel"
          git config --global user.name ci
          git config --global user.email ci@localhost
          "$HOME/bin/repo" init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6-2026-10 --no-repo-verify
          "$HOME/bin/repo" sync -c -j4 --no-tags --fail-fast
          df -h /

      - name: Integrate BakaSU
        working-directory: ${{ runner.temp }}/kernel
        run: |
          curl -fsSL https://raw.githubusercontent.com/Baka-SU/BakaSU/v4.2.0-rc3/kernel/setup.sh -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh v4.2.0-rc3
          test -L common/drivers/kernelsu
          grep -q "kernelsu" common/drivers/Makefile

      - name: Configure kernel
        working-directory: ${{ runner.temp }}/kernel
        run: |
          # CONFIG_KSU is tristate default y; keep gki_defconfig canonical for kleaf's savedefconfig check
          sed -i 's/^SUBLEVEL = 143$/SUBLEVEL = 118/' common/Makefile
          grep -q '^SUBLEVEL = 118' common/Makefile
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("build/kernel/kleaf/workspace_status_stamp.py")
          s = p.read_text()
          old = "    def collect(self) -> str:\n        ret = super().collect()"
          new = old + "\n        if forced := os.environ.get(\"KLEAF_FORCE_SCMVERSION\"):\n            ret = forced"
          assert old in s, "patch anchor not found"
          p.write_text(s.replace(old, new, 1))
          print("kleaf scmversion patch applied")
          PY

      - name: Build kernel
        working-directory: ${{ runner.temp }}/kernel
        env:
          BUILD_NUMBER: "16143355"
          KLEAF_FORCE_SCMVERSION: "-g0908354dac1b"
        run: |
          set -o pipefail
          tools/bazel build --config=fast --config=stamp --make_jobs=4 //common:kernel_aarch64 2>&1 | tee /tmp/build.log | tail -n 200

      - name: Verify version string
        working-directory: ${{ runner.temp }}/kernel
        run: |
          IMG=bazel-bin/common/kernel_aarch64/Image
          ls -l "$IMG"
          cat bazel-bin/common/kernel_aarch64/include/config/kernel.release
          CFG=$(find out bazel-bin -maxdepth 7 -name .config 2>/dev/null | head -1)
          echo "config: ${CFG:-none}"
          if [ -n "$CFG" ]; then
            grep -E "^CONFIG_KSU=|^CONFIG_KSU_TRACEPOINT_HOOK=" "$CFG" || true
            grep -q "^CONFIG_KSU=y$" "$CFG"
          fi
          strings "$IMG" | grep -m1 -iE "kernelsu|bakasu"
          VERSION=$(strings "$IMG" | grep -m1 -o 'Linux version [^ ]*')
          echo "$VERSION"
          test "$VERSION" = "Linux version 6.6.118-android15-8-g0908354dac1b-ab16143355-4k"
          echo VERSION_STRING_OK

      - name: Stage artifacts
        working-directory: ${{ runner.temp }}/kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp bazel-bin/common/kernel_aarch64/Image "$GITHUB_WORKSPACE/out/Image"
          cp bazel-bin/common/kernel_aarch64/include/config/kernel.release "$GITHUB_WORKSPACE/out/kernel.release"
          strings bazel-bin/common/kernel_aarch64/Image | grep -m1 'Linux version' > "$GITHUB_WORKSPACE/out/version.txt"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: out/
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
