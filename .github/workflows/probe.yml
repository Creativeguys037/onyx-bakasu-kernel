name: probe-branches
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe
        run: |
          b=android15-6.6-2026-01
          curl -fsSL "https://android.googlesource.com/kernel/common/+/refs/heads/$b/Makefile?format=TEXT" | base64 -d | grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) ="
          curl -fsSL "https://android.googlesource.com/kernel/common/+/refs/heads/$b/arch/arm64/configs/gki_defconfig?format=TEXT" | base64 -d > /tmp/d
          echo "--- defconfig size: $(wc -l < /tmp/d)"
          grep -nE "NR_CPUS|TASK_DELAY_ACCT|SCHEDSTATS|IRQ_TIME_ACCOUNTING|HZ" /tmp/d
          echo "--- full defconfig ---"
          cat /tmp/d
