name: probe-branches
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe
        run: |
          b=common-android15-6.6-2026-01
          curl -fsSL "https://android.googlesource.com/kernel/build/+/refs/heads/$b/kleaf/workspace_status_stamp.py?format=TEXT" | base64 -d > /tmp/f
          echo "size=$(wc -c < /tmp/f)"
          grep -nE "def collect|super\(\)\.collect\(\)|class " /tmp/f | head -20
