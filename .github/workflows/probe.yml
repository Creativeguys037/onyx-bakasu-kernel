name: probe-branches
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe
        run: |
          b=android15-6.6-2026-01
          for p in build/kernel/kleaf/workspace_status_stamp.py build/kernel/kleaf/workspace_status.py; do
            echo "== $p"
            curl -fsSL "https://android.googlesource.com/kernel/common/+/refs/heads/$b/$p?format=TEXT" | base64 -d > /tmp/f || { echo fetch_fail; continue; }
            grep -nE "class .*Stamp|def collect|SCMVERSION|stamp" /tmp/f | head -12
            grep -n "super().collect()" /tmp/f | head -3
          done
