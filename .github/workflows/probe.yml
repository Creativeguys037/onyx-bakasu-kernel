name: probe-branches
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Probe
        run: |
          m=common-android15-6.6-2026-01
          curl -fsSL "https://android.googlesource.com/kernel/manifest/+/refs/heads/$m/default.xml?format=TEXT" | base64 -d > /tmp/mf
          cat /tmp/mf
          for inc in $(grep -oE 'include name="[^"]+"' /tmp/mf | cut -d'"' -f2); do
            echo "=== include: $inc"
            curl -fsSL "https://android.googlesource.com/kernel/manifest/+/refs/heads/$m/$inc?format=TEXT" | base64 -d > /tmp/m2 && grep -nE 'name="build/kernel"|build/kernel' /tmp/m2 | head -3
          done
